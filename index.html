<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加载中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* ===== 风格1: 骨架屏 (skeleton) - 全屏 ===== */
        .style-skeleton .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 30px;
            overflow: hidden;
            animation: none;
            box-shadow: none;
            border-radius: 0;
            max-width: 100%;
        }
        .style-skeleton .skeleton-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0 20px;
            border-bottom: 1px solid #f0f2f5;
        }
        .style-skeleton .skeleton-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(90deg, #e8ecf1 25%, #f0f2f5 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        .style-skeleton .skeleton-title-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .style-skeleton .skeleton-line {
            height: 14px;
            border-radius: 6px;
            background: linear-gradient(90deg, #e8ecf1 25%, #f0f2f5 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .style-skeleton .skeleton-line.short { width: 35%; }
        .style-skeleton .skeleton-line.medium { width: 55%; }
        .style-skeleton .skeleton-line.long { width: 75%; }
        .style-skeleton .skeleton-line.full { width: 100%; }
        .style-skeleton .skeleton-line.half { width: 48%; }

        .style-skeleton .skeleton-banner {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            background: linear-gradient(90deg, #e8ecf1 25%, #f0f2f5 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            margin: 20px 0;
        }

        .style-skeleton .skeleton-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }
        .style-skeleton .skeleton-body .skeleton-line {
            height: 16px;
        }
        .style-skeleton .skeleton-body .skeleton-line:last-child {
            width: 60%;
        }

        .style-skeleton .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 16px 0;
        }
        .style-skeleton .skeleton-grid .grid-item {
            height: 100px;
            border-radius: 10px;
            background: linear-gradient(90deg, #e8ecf1 25%, #f0f2f5 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .style-skeleton .skeleton-grid .grid-item:nth-child(2) { animation-delay: 0.2s; }
        .style-skeleton .skeleton-grid .grid-item:nth-child(3) { animation-delay: 0.4s; }
        .style-skeleton .skeleton-grid .grid-item:nth-child(4) { animation-delay: 0.6s; }

        .style-skeleton .skeleton-footer {
            display: flex;
            gap: 14px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f0f2f5;
        }
        .style-skeleton .skeleton-btn {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(90deg, #e8ecf1 25%, #f0f2f5 50%, #e8ecf1 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }
        .style-skeleton .skeleton-btn:last-child {
            flex: 0.6;
        }

        .style-skeleton .loading-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #bbb;
            letter-spacing: 0.5px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ===== 风格2: 三点脉冲 (dots) ===== */
        .style-dots .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .style-dots .dot-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .style-dots .dot-group span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1890ff;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .style-dots .dot-group span:nth-child(2) { animation-delay: 0.2s; }
        .style-dots .dot-group span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ===== 风格3: 单圈旋转 (spinner) ===== */
        .style-spinner .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .style-spinner .spinner-ring {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid #e8ecf1;
            border-top-color: #1890ff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== 风格4: 跳动方块 (bounce) ===== */
        .style-bounce .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .style-bounce .bounce-group {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }
        .style-bounce .bounce-group span {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: #1890ff;
            animation: bounce 1.2s ease-in-out infinite;
        }
        .style-bounce .bounce-group span:nth-child(2) { animation-delay: 0.2s; }
        .style-bounce .bounce-group span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-14px); opacity: 1; }
        }

        /* ===== 风格5: 水波纹扩散 (ripple) ===== */
        .style-ripple .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .style-ripple .ripple-box {
            position: relative;
            width: 44px;
            height: 44px;
        }
        .style-ripple .ripple-box .ripple {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #1890ff;
            opacity: 0;
            animation: ripple 1.6s ease-out infinite;
        }
        .style-ripple .ripple-box .ripple:nth-child(2) {
            animation-delay: 0.8s;
        }
        @keyframes ripple {
            0% { transform: scale(0.4); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* ===== 通用文字（用于非骨架风格） ===== */
        .loading-text {
            font-size: 14px;
            color: #999;
            letter-spacing: 1px;
            font-weight: 400;
            margin-top: 4px;
        }
        .loading-text .dot {
            display: inline-block;
            animation: dot-bounce 1.4s infinite;
            font-weight: 700;
        }
        .loading-text .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-text .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce {
            0%, 80%, 100% { opacity: 0; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-3px); }
        }

        /* ===== 内容卡片（通用） ===== */
        .content-box {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            text-align: center;
            animation: fade-in 0.4s ease;
        }
        .content-box .icon-svg {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            display: block;
            color: #ccc;
        }
        .content-box .icon-svg.error { color: #ff4d4f; }
        .content-box .icon-svg.info { color: #1890ff; }
        .content-box .icon-svg.success { color: #52c41a; }
        .content-box .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .content-box .desc {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .content-box .product-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1a1a2e;
        }
        .content-box .btn-link {
            display: inline-block;
            padding: 10px 28px;
            background: #1890ff;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, transform 0.15s;
            border: none;
            cursor: pointer;
            min-width: 120px;
        }
        .content-box .btn-link:hover {
            background: #40a9ff;
        }
        .content-box .btn-link:active {
            transform: scale(0.96);
        }
        .content-box .btn-link.success {
            background: #52c41a;
        }
        .content-box .btn-link.success:hover {
            background: #73d13d;
        }
        .content-box .btn-link.secondary {
            background: #f0f2f5;
            color: #333;
        }
        .content-box .btn-link.secondary:hover {
            background: #e4e7eb;
        }
        .content-box .btn-link:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            animation: toast-in 0.3s ease;
            max-width: 90%;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .toast.success {
            background: rgba(82, 196, 26, 0.88);
        }
        .toast.error {
            background: rgba(255, 77, 79, 0.88);
        }
        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .toast.hide {
            animation: toast-out 0.25s ease forwards;
        }
        @keyframes toast-out {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-12px); }
        }

        /* ===== iframe 全屏 ===== */
        .iframe-full {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        /* ===== 动画 ===== */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fade-in 0.35s ease;
        }
    </style>
</head>
